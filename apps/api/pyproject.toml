[project]
name = "roleradar-api"
version = "0.1.0"
description = "RoleRadarAI backend API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-jobspy",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
# JobSpy ships without type hints; only app/discovery/jobspy_source.py imports it.
module = ["jobspy", "jobspy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF and python-docx ship without type hints; only these modules call them.
module = ["app.services.resume_parser", "tests.resume_samples"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF's SWIG bindings warn on import under Python 3.13; harmless.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy.git", rev = "dbcbf85453d7986bf1f95420e12fb11e0bccabb3" }
