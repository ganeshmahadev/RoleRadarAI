# Local development stack. OpenJev is NOT here: it runs natively on the macOS host
# with MLX (Metal GPU) on port 4100 — see docs/ARCHITECTURE.md.
name: roleradar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roleradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roleradar}
      POSTGRES_DB: ${POSTGRES_DB:-roleradar}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roleradar}:${POSTGRES_PASSWORD:-roleradar}@postgres:5432/${POSTGRES_DB:-roleradar}
      REDIS_URL: redis://redis:6379/0
      OPENJEV_BASE_URL: http://host.docker.internal:4100
      UPLOAD_DIR: /var/lib/roleradar/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - uploads:/var/lib/roleradar/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roleradar}:${POSTGRES_PASSWORD:-roleradar}@postgres:5432/${POSTGRES_DB:-roleradar}
      REDIS_URL: redis://redis:6379/0
      OPENJEV_BASE_URL: http://host.docker.internal:4100
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
